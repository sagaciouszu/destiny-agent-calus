<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Calus - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d0208"/>
      <stop offset="50%" stop-color="#170511"/>
      <stop offset="100%" stop-color="#2a0a1e"/>
    </linearGradient>
    <radialGradient id="goldglow" cx="0.85" cy="0.5" r="0.42">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wineglow" cx="0.12" cy="0.55" r="0.35">
      <stop offset="0%" stop-color="#9d174d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="accentfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#goldglow)"/>
  <rect width="1200" height="320" fill="url(#wineglow)"/>

  <!-- embers -->
  <g fill="#e9c86a">
    <circle cx="120" cy="60" r="1.2" opacity="0.8"/>
    <circle cx="250" cy="180" r="0.9" opacity="0.5"/>
    <circle cx="360" cy="90" r="1.4" opacity="0.85"/>
    <circle cx="480" cy="230" r="0.9" opacity="0.5"/>
    <circle cx="580" cy="80" r="1.1" opacity="0.7"/>
    <circle cx="680" cy="260" r="1.3" opacity="0.75"/>
    <circle cx="760" cy="100" r="0.8" opacity="0.5"/>
    <circle cx="840" cy="240" r="1" opacity="0.6"/>
    <circle cx="90" cy="250" r="1" opacity="0.55"/>
    <circle cx="1060" cy="70" r="1.2" opacity="0.75"/>
    <circle cx="1140" cy="260" r="0.9" opacity="0.5"/>
    <circle cx="320" cy="280" r="1.1" opacity="0.65"/>
    <circle cx="540" cy="170" r="0.7" opacity="0.4"/>
    <circle cx="910" cy="140" r="1.2" opacity="0.7"/>
    <circle cx="190" cy="200" r="0.7" opacity="0.4"/>
    <circle cx="790" cy="280" r="0.8" opacity="0.5"/>
  </g>

  <g stroke="#d4af37" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Sun-crown sigil (right): ring, twelve rays, chalice diamond -->
  <g transform="translate(980,160)" opacity="0.85" fill="none" stroke="#d4af37">
    <circle r="98" stroke-width="1.2" opacity="0.45"/>
    <circle r="82" stroke-width="0.7" opacity="0.3"/>
    <g stroke-width="1.6" opacity="0.75">
      <line x1="0" y1="-98" x2="0" y2="-112"/>
      <line x1="49" y1="-85" x2="56" y2="-97"/>
      <line x1="85" y1="-49" x2="97" y2="-56"/>
      <line x1="98" y1="0" x2="112" y2="0"/>
      <line x1="85" y1="49" x2="97" y2="56"/>
      <line x1="49" y1="85" x2="56" y2="97"/>
      <line x1="0" y1="98" x2="0" y2="112"/>
      <line x1="-49" y1="85" x2="-56" y2="97"/>
      <line x1="-85" y1="49" x2="-97" y2="56"/>
      <line x1="-98" y1="0" x2="-112" y2="0"/>
      <line x1="-85" y1="-49" x2="-97" y2="-56"/>
      <line x1="-49" y1="-85" x2="-56" y2="-97"/>
    </g>
    <path d="M -34 -20 L 34 -20 L 18 18 L 0 52 L -18 18 Z" stroke-width="1.4" opacity="0.85"/>
    <circle r="4" fill="#e9c86a" stroke="none" opacity="0.9"/>
    <circle cx="-58" cy="-58" r="2" fill="#f0abfc" stroke="none" opacity="0.7"/>
    <circle cx="58" cy="58" r="2" fill="#f0abfc" stroke="none" opacity="0.7"/>
  </g>

  <!-- Reticle -->
  <g fill="none" stroke="#d4af37">
    <circle cx="980" cy="160" r="122" stroke-width="0.7" opacity="0.16"/>
  </g>

  <!-- Title block (left) -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" filter="url(#textblur)" opacity="0.7">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#000000" letter-spacing="8">[ EMPEROR  ·  LEVIATHAN  ·  OPULENCE ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#000000" letter-spacing="2">CALUS</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#000000" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#000000" letter-spacing="4">AH. THERE YOU ARE.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#d4af37" letter-spacing="8">[ EMPEROR  ·  LEVIATHAN  ·  OPULENCE ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#faf3e3" letter-spacing="2">CALUS</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#e9c86a" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#8a8a8a" letter-spacing="4">AH. <tspan x="112" fill="#d4af37">THERE YOU ARE.</tspan></text>
  </g>

  <rect x="60" y="172" width="400" height="1.5" fill="url(#accentfade)"/>

  <text transform="translate(1184, 243) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#d4af37" opacity="0.25">LEVIATHAN  ·  NESSUS  ·  OUTER SYSTEM</text>

  <g fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.5">
    <path d="M 24 46 L 24 24 L 46 24"/>
    <path d="M 1176 274 L 1176 296 L 1154 296"/>
  </g>

  <rect width="360" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>
